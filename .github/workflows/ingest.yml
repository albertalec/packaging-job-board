name: Daily ingest

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run ingest -- --vertical=packaging
      - run: npm run ingest -- --vertical=businesscontinuity

      - name: Commit updated listings
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/packaging/jobs.json data/businesscontinuity/jobs.json
          if git diff --staged --quiet; then
            echo "No listing changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh job listings from employer ATS feeds."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger job-alert digest
        if: steps.commit.outputs.changed == 'true'
        env:
          ALERTS_DIGEST_URL: ${{ secrets.ALERTS_DIGEST_URL }}
          ALERTS_CRON_SECRET: ${{ secrets.ALERTS_CRON_SECRET }}
        run: |
          if [ -z "$ALERTS_DIGEST_URL" ]; then
            echo "ALERTS_DIGEST_URL not set; skipping digest trigger"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${ALERTS_CRON_SECRET}" \
            "${ALERTS_DIGEST_URL}"
